services:
  postgres:
    image: postgres:16-alpine
    container_name: m0-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenue_guardian
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_guardian"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7-alpine
    container_name: m0-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

